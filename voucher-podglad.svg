ontaktu</text><text x="52" y="282" font-size="11" font-weight="bold" fill="#8a8a80" letter-spacing="3">DLA</text><line x1="96" y1="288" x2="628" y2="288" stroke="#2d5016" stroke-width="1.5"/><text x="340" y="364" font-size="16" font-weight="bold" fill="#2d5016" text-anchor="middle">Poznaj świat golfa podczas 2-godzinnej lekcji pierwszego kontaktu!</text><text x="340" y="392" font-size="14" fill="#333330" text-anchor="middle">Zobaczysz, co znaczy czyste uderzenie, opanujesz kluczowe ruchy</text><text x="340" y="413" font-size="14" fill="#333330" text-anchor="middle">i dowiesz się, czym różni się birdie od par.</text><text x="340" y="443" font-size="15" font-weight="bold" fill="#2d5016" text-anchor="middle">Zero stresu, pełen sprzęt na miejscu i mnóstwo dobrej zabawy</text><text x="340" y="465" font-size="15" font-weight="bold" fill="#2d5016" text-anchor="middle">od pierwszego zamachu!</text><text x="340" y="506" font-size="11" font-weight="bold" fill="#2d5016" text-anchor="middle" letter-spacing="2">NA LEKCJI POZNASZ</text><rect x="75.7" y="524" width="126.4" height="30" fill="#ffffff" stroke="#2d5016" stroke-width="1" rx="15"/><text x="138.9" y="544" font-size="12" fill="#2d5016" text-anchor="middle">Czym jest golf</text><rect x="214.1" y="524" width="185.8" height="30" fill="#ffffff" stroke="#2d5016" stroke-width="1" rx="15"/><text x="307.0" y="544" font-size="12" fill="#2d5016" text-anchor="middle">Zasady panujące na polu</text><rect x="411.9" y="524" width="192.4" height="30" fill="#ffffff" stroke="#2d5016" stroke-width="1" rx="15"/><text x="508.1" y="544" font-size="12" fill="#2d5016" text-anchor="middle">Swing i podstawy uderzeń</text><rect x="148.2" y="562" width="152.8" height="30" fill="#ffffff" stroke="#2d5016" stroke-width="1" rx="15"/><text x="224.6" y="582" font-size="12" fill="#2d5016" text-anchor="middle">Putting i chipping</text><rect x="313.0" y="562" width="218.8" height="30" fill="#ffffff" stroke="#2d5016" stroke-width="1" rx="15"/><text x="422.4" 