*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f7f5f0;min-height:100vh}
a{text-decoration:none}
.header{background:#111;padding:28px 40px 0;border-bottom:1px solid #222}
.header-top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:20px}
.logo{font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:700;color:#fff;letter-spacing:-0.01em}
.logo-sub{font-size:13px;color:#666;margin-top:4px}
.stats{display:flex;gap:24px}
.stat-item{text-align:center}
.stat-val{font-size:22px;font-weight:700;color:#fff}
.stat-val.green{color:#4ade80}
.stat-label{font-size:11px;color:#666;margin-top:2px}
.search-wrap{position:relative;margin-bottom:0}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;color:#555}
.search-input{width:100%;background:#1e1e1e;border:1px solid #333;border-radius:10px;padding:10px 14px 10px 40px;font-size:14px;color:#fff;outline:none;font-family:'DM Sans',sans-serif;margin-bottom:20px}
.search-input::placeholder{color:#555}
.search-input:focus{border-color:#555}
.tabs{display:flex;gap:0;overflow-x:auto;padding:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;cursor:pointer;padding:14px 16px;font-size:13px;font-weight:600;color:#666;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:color 0.15s;font-family:'DM Sans',sans-serif}
.tab.active{color:#fff;border-bottom:2px solid #fff}
.tab:hover:not(.active){color:#aaa}
.tab-badge{font-size:11px;background:#333;color:#888;border-radius:20px;padding:1px 7px;font-weight:700;transition:all 0.15s}
.tab.active .tab-badge{background:#fff;color:#111}
.content{max-width:900px;margin:0 auto;padding:28px 40px 60px}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:16px 20px;transition:box-shadow 0.2s,transform 0.2s;position:relative}
.card:hover{box-shadow:0 8px 32px rgba(0,0,0,0.10);transform:translateY(-2px)}
.card.done{background:linear-gradient(135deg,#f0fdf4 0%,#fff 100%);border-color:#86efac}
.done-badge{position:absolute;top:14px;right:16px;font-size:11px;font-weight:700;color:#16a34a;background:#dcfce7;padding:2px 10px;border-radius:20px;letter-spacing:0.04em}
.card-top{display:flex;gap:14px;margin-bottom:0}
.thumb-wrap{position:relative;width:88px;height:54px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#111;display:block}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;opacity:0.9}
.thumb-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.thumb-play span{width:24px;height:24px;background:rgba(0,0,0,0.55);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;padding-left:2px}
.card-body{flex:1;min-width:0}
.card-title{font-family:'Playfair Display',Georgia,serif;font-size:14px;font-weight:700;color:#111;line-height:1.4;margin-bottom:4px;padding-right:100px}
.card-title.no-badge{padding-right:0}
.card-author{font-size:12px;color:#888;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;letter-spacing:0.02em;white-space:nowrap}
.card-notes{border-top:1px solid #e8f5e9;margin-top:12px;padding:10px 12px;font-size:12px;color:#374151;line-height:1.6;background:#f9fefb;border-radius:8px}
.notes-label{font-weight:700;color:#16a34a;margin-right:6px}
.card-footer{display:flex;justify-content:flex-end;margin-top:10px}
.yt-btn{font-size:12px;color:#dc2626;display:flex;align-items:center;gap:4px;font-weight:600}
.yt-btn:hover{color:#b91c1c}
.empty{text-align:center;padding:60px 0;color:#aaa;font-size:15px}
@media(max-width:600px){.header{padding:20px 20px 0}.content{padding:20px 20px 40px}.card-title{padding-right:0}.done-badge{position:static;display:inline-block;margin-bottom:6px}}
</style>

<script>
const VIDEOS = [

  {id:"ezf7XjbETD0",cat:"driver",title:"3 tips to fix driver slice for good",author:"Lista odtwarzania",tags:["Slice fix"],done:false},

  {id:"Z9w2uDTRheg",cat:"wedges",title:"Ryan Hager's favorite range game to learn club face control",author:"The Golfer's Journal",tags:["Face control"],done:false},

const TABS=[{id:"all",label:"Wszystkie",icon:"⬡"},{id:"driver",label:"Driver",icon:"▲"},{id:"wedges",label:"Wedges & irons",icon:"◈"},{id:"short",label:"Short game",icon:"◉"},{id:"putting",label:"Putting",icon:"○"},{id:"cm",label:"Course management",icon:"◇"}];
const TAG_COLORS={"Dystans":"#2d6a4f","Kontakt":"#1d3a6e","Kierunek":"#1d3a6e","Slice fix":"#7b2d00","Rotacja":"#4a1a6b","Biodra":"#4a1a6b","Weight transfer":"#4a1a6b","Footwork":"#4a1a6b","Driver + iron":"#1d3a6e","Wedge / ogólny":"#1d3a6e","Wedge 100y":"#1d3a6e","Trajektoria":"#1d3a6e","Swing / wedge":"#1d3a6e","Technika":"#1d3a6e","Sub-100y":"#1d3a6e","Kompletny":"#2d6a4f","Pitching":"#1d3a6e","Hook fix":"#7b2d00","Face control":"#1d3a6e","Ball striking":"#2d6a4f","Chipping":"#7b3a00","Film study":"#7b3a00","Release":"#7b3a00","Ogólny":"#7b3a00","7 tipów":"#0a4a3a","Driver strategy":"#3a1a6b","Bogey avoid":"#3a1a6b","Score":"#3a1a6b","Game plan":"#3a1a6b"};

function getCounts(){const c={all:VIDEOS.length};TABS.slice(1).forEach(t=>{c[t.id]=VIDEOS.filter(v=>v.cat===t.id).length;});return c;}
function renderTabs(){const counts=getCounts();document.getElementById("tabs").innerHTML=TABS.map(t=>`<button class="tab ${activeTab===t.id?'active':''}" onclick="setTab('${t.id}')">${t.icon} ${t.label} <span class="tab-badge">${counts[t.id]}</span></button>`).join("");}
function renderCards(){let list=activeTab==="all"?VIDEOS:VIDEOS.filter(v=>v.cat===activeTab);if(searchVal.trim()){const q=searchVal.toLowerCase();list=list.filter(v=>v.title.toLowerCase().includes(q)||v.author.toLowerCase().includes(q)||v.tags.some(t=>t.toLowerCase().includes(q)));}const el=document.getElementById("cards");const empty=document.getElementById("empty");if(!list.length){el.innerHTML="";empty.style.display="block";return;}empty.style.display="none";el.innerHTML=list.map(v=>{const ytUrl=`https://www.youtube.com/watch?v=${v.id}`;const tags=v.tags.map(t=>{const c=TAG_COLORS[t]||"#333";return `<span class="tag" style="background:${c}18;color:${c};border:1px solid ${c}30">${t}</span>`;}).join("");return `<div class="card ${v.done?'done':''}">${v.done?'<span class="done-badge">OPRACOWANY</span>':''}<div class="card-top"><a class="thumb-wrap" href="${ytUrl}" target="_blank" rel="noopener"><img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" alt="" onerror="this.style.display='none'"><div class="thumb-play"><span>▶</span></div></a><div class="card-body"><div class="card-title ${v.done?'':'no-badge'}">${v.title}</div><div class="card-author">${v.author}</div><div class="tags">${tags}</div></div></div>${v.notes?`<div class="card-notes"><span class="notes-label">Notatki:</span>${v.notes}</div>`:''}<div class="card-footer"><a class="yt-btn" href="${ytUrl}" target="_blank">▶ Otwórz na YouTube</a></div></div>`;}).join("");}
